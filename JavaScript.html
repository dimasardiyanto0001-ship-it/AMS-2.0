  function makeRunProxy_(successFn, failureFn) {

      get: function (target, prop) {
        if (prop === 'withSuccessHandler') return function (fn) { return makeRunProxy_(fn, failureFn); };

<script>
  /*************************************************************
   * DAFTAR ISI — cari dengan Ctrl+F teks "============ NAMA BAGIAN"
   * (urutan di bawah = urutan di file; sub-bagian bertanda "----" ada di dalamnya)
   *
   *  - ARSIP PERIODE
   *  - LAPORAN LOG ABSENSI (EXCEL)
   *  - HAPUS ARSIP (PERMANEN)
   *  - AUTH (Login Gate — seluruh tampilan wajib login)
   *  - RENDER
   *  - PENCARIAN / FILTER NAMA KARYAWAN
   *  - CHARTS (Tren Harian, Plan vs Actual, Jam Kerja & Lembur)
   *  - TREN KEHADIRAN BULANAN (Dashboard)
   *  - PERBANDINGAN PERIODE SEBELUMNYA (untuk indikator tren ↑↓)
   *  - TOP 5 TERENDAH / TERBAIK
   *  - CARDS DASHBOARD (ringkasan + rincian absen + rata-rata jam kerja)
   *  - INPUT REALISASI & JADWAL (pilih sel, pilih kode, Simpan Batch; butuh login)
   *  - TAMBAH KARYAWAN
   *  - HAPUS KARYAWAN (RESIGN)
   *  - KEPEGAWAIAN: DAFTAR KARYAWAN
   *  - GANTI PASSWORD
   *  - UPLOAD JADWAL (EXCEL)
   *  - UPLOAD REALISASI (EXCEL)
   *  - UPLOAD ABSEN FINGER (XLS/XLSX)
   *  - DOWNLOAD PDF
   *  - UTIL
   *  - REPORT (Summary/Detail/Department/Exception)
   *  - CHATBOT AI
   *  - HAK AKSES: FILTER SIDEBAR SESUAI PERMISSION
   *  - SETTING » ACCOUNT
   *  - SETTING » JAM KERJA
   *  - SETTING » ASSIGN KARYAWAN KE JADWAL
   *  - SETTING » HAK AKSES
   *  - PENGAJUAN IZIN (Notifikasi + Approve/Reject) — REBUILD v2 (fix onclick)
   *  - DOWNLOAD DASHBOARD SEBAGAI PDF (screenshot HTML, bukan sheet)
   *  - SETTING » AUDIT LOG
   *  - NOTIFIKASI LONCENG
   *************************************************************/
  let MY_PERMISSIONS_ = { view: [], edit: [] };
  let STATE = null;
  let SESSION = null; // { token, username, nama, role }
  const POLL_INTERVAL_MS = 20000;
  let pollTimer = null;
  const SESSION_STORAGE_KEY = 'rekap_session_v1';
  let currentViewPeriodKey = 'active'; // 'active' atau periodKey arsip
  let currentDeptFilter = 'ALL'; // 'ALL' atau nama Department yang dipilih di dropdown
  let avgJamKerjaMode = 'hari'; // 'hari' | 'minggu' | 'bulan' — untuk card Rata-rata Jam Kerja / Orang

document.addEventListener('DOMContentLoaded', () => {
    initTabs();
    document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
    document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
    document.getElementById('gateLoginSubmit').addEventListener('click', submitGateLogin);
    document.getElementById('gatePassword').addEventListener('keydown', e => { if (e.key === 'Enter') submitGateLogin(); });
    document.getElementById('addEmployeeCancel').addEventListener('click', closeAddEmployeePicker);
    document.getElementById('addEmployeeSubmit').addEventListener('click', submitAddEmployee);
    document.getElementById('deleteArchiveCancel').addEventListener('click', closeDeleteArchivePicker);
    document.getElementById('deleteArchiveSubmit').addEventListener('click', submitDeleteArchive);
    document.getElementById('deleteArchiveConfirmInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitDeleteArchive(); });
    document.getElementById('deleteEmployeeCancel').addEventListener('click', closeDeleteEmployeePicker);
    document.getElementById('deleteEmployeeSubmit').addEventListener('click', submitDeleteEmployee);
    document.getElementById('nikCancel').addEventListener('click', closeNikPicker);
    document.getElementById('nikSubmit').addEventListener('click', submitNik);
    document.getElementById('karyawanCancel').addEventListener('click', closeKaryawanPicker);
    document.getElementById('karyawanSubmit').addEventListener('click', submitKaryawanData);
    document.getElementById('changePasswordCancel').addEventListener('click', closeChangePasswordPicker);
    document.getElementById('changePasswordSubmit').addEventListener('click', submitChangePassword);
    document.getElementById('nikInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitNik(); });
    document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));
    document.getElementById('aiChatSend').addEventListener('click', sendAIChatMessage);
    document.getElementById('aiChatClose').addEventListener('click', closeAIChatPicker);
    document.getElementById('aiChatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendAIChatMessage(); });
    initAIChatDrag_();
    document.getElementById('addUserCancel').addEventListener('click', closeAddUserPicker);
    document.getElementById('addUserSubmit').addEventListener('click', submitAddUser);
    document.getElementById('resetUserPasswordCancel').addEventListener('click', closeResetUserPasswordPicker);
    document.getElementById('resetUserPasswordSubmit').addEventListener('click', submitResetUserPassword);
    document.getElementById('addRoleCancel').addEventListener('click', closeAddRolePicker);
    document.getElementById('addRoleSubmit').addEventListener('click', submitAddRole);
    document.getElementById('rejectPengajuanCancel').addEventListener('click', closeRejectPengajuanPicker);
    document.getElementById('rejectPengajuanSubmit').addEventListener('click', submitRejectPengajuan);
    initNotifBell_();
    restoreSession();
  });

const TAB_TITLES_ = {
  dashboard: 'Dashboard', jadwal: 'Jadwal Kerja', input: 'Input Realisasi',
  pengajuanizin: 'Pengajuan Izin', // ===== TAMBAHAN PENGAJUAN IZIN =====
  rekap: 'Rekap Karyawan', logabsensi: 'Log Absensi', relieverdata: 'Data Reliever', daftarkaryawan: 'Daftar Karyawan', daftarreliever: 'Daftar Reliever',
  reportsummary: 'Summary Report', reportdetail: 'Detail Report',
  reportdept: 'Department Report', reportexception: 'Exception Report',
  settingaccount: 'Setting - Account', settinghakakses: 'Setting - Hak Akses',
  settingjamkerja: 'Setting - Jam Kerja', settingjadwalkerja: 'Setting - Jadwal Kerja',
  settingassignjadwal: 'Setting - Assign Karyawan ke Jadwal',
  settinglibur: 'Setting - Hari Libur', settingfingerprint: 'Setting - Integrasi Fingerprint',
  settingauditlog: 'Setting - Audit Log'
};

  function initTabs() {
    document.querySelectorAll('.nav-group-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const group = toggle.closest('.nav-group');
        const wasOpen = group.classList.contains('open');
        document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('open'));
        if (!wasOpen) group.classList.add('open');
      });
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectTab_(btn.dataset.tab);
        closeSidebar();
      });
    });
  }

  function selectTab_(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
    const content = document.getElementById('tab-' + tabName);
    if (btn) btn.classList.add('active');
    if (content) content.classList.add('active');

    const parentGroup = btn ? btn.closest('.nav-group') : null;
    document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('open'));
    if (parentGroup) parentGroup.classList.add('open');

    const titleEl = document.getElementById('topbarTabTitle');
    if (titleEl) titleEl.textContent = TAB_TITLES_[tabName] || 'Dashboard';
        const breadcrumbEl = document.getElementById('breadcrumbTabName');
    if (breadcrumbEl) breadcrumbEl.textContent = TAB_TITLES_[tabName] || 'Dashboard';

    if (tabName === 'daftarkaryawan') loadDaftarKaryawan();
    if (tabName === 'pengajuanizin') loadPengajuanList_(); // ===== TAMBAHAN PENGAJUAN IZIN =====
    if (tabName.indexOf('report') === 0) initReportFilters_(tabName);
    if (tabName === 'settingaccount') loadUsersList();
    if (tabName === 'settingjamkerja') loadJamKerjaSettings();
    if (tabName === 'settinghakakses') loadHakAksesMatrix();
    if (tabName === 'settingassignjadwal') loadUnassignedEmployees_();
    if (tabName === 'settingauditlog') loadAuditLog_();
    if (tabName === 'settingjadwalkerja') sjkMuatDaftarPola();
    if (tabName === 'relieverdata') initRelieverData_();
    if (tabName === 'daftarreliever') loadRelieverMaster_();
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (SESSION && currentViewPeriodKey === 'active') loadData(false); // jangan polling kalau sedang lihat arsip / belum login
    }, POLL_INTERVAL_MS);
  }

  /** Deteksi pesan error yang berarti sesi login sudah tidak valid, supaya otomatis diarahkan balik ke gate. */
  function isAuthError_(message) {
    const m = String(message || '');
    return m.indexOf('login') !== -1 || m.indexOf('Sesi') !== -1;
  }

  function loadData(showToast) {
    if (!SESSION) { showLoginGate(); return; }
    if (currentViewPeriodKey !== 'active') {
      loadArchivedData_(currentViewPeriodKey, showToast);
      return;
    }
    loadRelieverSummary_(!!showToast); // diminta bersamaan dengan data utama (tidak menunggu), supaya kartu reliever tidak telat
    google.script.run
      .withSuccessHandler(data => {
        STATE = data;
        renderAll(); // renderAll juga menggambar panel reliever bila datanya sudah datang lebih dulu
        if (showToast) toast('Data terbaru dimuat');
      })
      .withFailureHandler(err => {
        toast('Gagal memuat data: ' + err.message, true);
        if (isAuthError_(err.message)) doLogout();
      })
      .getAllData(SESSION.token, currentDeptFilter);
  }

  /* ============ RELIEVER DI DASHBOARD ============ */

  let RELIEVER_SUMMARY_ = null;
  let relieverSummaryLoadedAt_ = 0;
  let relieverSummaryLoading_ = false;
  let relieverSummaryToken_ = null;
  let relieverBackendMissing_ = false; // true bila backend lama (route belum ada): panel disembunyikan, tidak diulang menggangu
  const RELIEVER_REFRESH_MS = 60000;

  function setRelieverPanelVisible_(show) {
    const p = document.getElementById('relieverPanel');
    if (p) p.classList.toggle('hidden', !show);
  }

  /** Muat data reliever (maks 1x per 60 detik kecuali dipaksa). Gagal = pesan error di panel, dashboard tetap jalan. */
  function loadRelieverSummary_(force) {
    if (!SESSION || currentViewPeriodKey !== 'active') { setRelieverPanelVisible_(false); return; }
    if (relieverSummaryLoading_) return;
    if (relieverSummaryToken_ !== SESSION.token) { RELIEVER_SUMMARY_ = null; dashRange_ = null; relieverSummaryToken_ = SESSION.token; } // ganti akun = data lama dibuang
    if (!force && RELIEVER_SUMMARY_ && Date.now() - relieverSummaryLoadedAt_ < RELIEVER_REFRESH_MS) { if (STATE) renderRelieverPanel_(); return; }
    if (!RELIEVER_SUMMARY_ && !relieverBackendMissing_) {
      // pemuatan pertama: tampilkan penanda, bukan panel kosong atau hilang
      setRelieverPanelVisible_(true);
      const c = document.getElementById('relieverCards');
      if (c) c.innerHTML = '<p class="muted">Memuat data reliever...</p>';
    }
    relieverSummaryLoading_ = true;
    google.script.run
      .withSuccessHandler(res => {
        relieverSummaryLoading_ = false;
        relieverBackendMissing_ = false;
        RELIEVER_SUMMARY_ = res;
        relieverSummaryLoadedAt_ = Date.now();
        if (STATE) renderRelieverPanel_(); // bila data utama belum datang, renderAll yang menggambarnya
      })
      .withFailureHandler(err => {
        relieverSummaryLoading_ = false;
        const msg = (err && err.message) || 'Terjadi kesalahan.';
        if (isAuthError_(msg)) return;
        if (msg.indexOf('Action tidak dikenal') !== -1) {
          // Backend (Apps Script) pada deployment ini belum diperbarui: sembunyikan panel, jangan tampilkan galat.
          relieverBackendMissing_ = true;
          setRelieverPanelVisible_(false);
          if (window.console) console.warn('Panel reliever disembunyikan: backend belum memuat getRelieverSummary. Perbarui 24_BackupReliever.gs dan 01_Router.gs lalu deploy versi baru.');
          return;
        }
        showRelieverError_(msg);
      })
      .getRelieverSummary(SESSION.token);
  }

  function showRelieverError_(msg) {
    setRelieverPanelVisible_(true);
    const e = document.getElementById('relieverError');
    if (e) { e.textContent = 'Data reliever gagal dimuat: ' + msg; e.classList.remove('hidden'); }
    const c = document.getElementById('relieverCards');
    if (c) c.innerHTML = '';
  }

  /** Hitung kartu reliever untuk rentang tanggal dari..sampai (inklusif) dari data per hari. */
  function hitungKartuReliever_(data, dari, sampai) {
    const rows = (data || []).filter(r => r.hari >= dari && r.hari <= sampai);
    const relieverSet = {}, digantikanSet = {};
    rows.forEach(r => {
      relieverSet[String(r.reliever).toLowerCase()] = true;
      digantikanSet[String(r.menggantikan).toLowerCase()] = true;
    });
    return {
      reliever: Object.keys(relieverSet).length,
      penggantian: rows.length,
      digantikan: Object.keys(digantikanSet).length,
      luarRadius: rows.filter(r => r.status === 'Di Luar Radius').length,
      belumPulang: rows.filter(r => r.belumPulang).length
    };
  }

  function renderRelieverPanel_() {
    const s = RELIEVER_SUMMARY_;
    if (!s || currentViewPeriodKey !== 'active') { setRelieverPanelVisible_(false); return; }
    setRelieverPanelVisible_(true);
    const errEl = document.getElementById('relieverError');
    if (errEl) errEl.classList.add('hidden');

    // Rentang tanggal = filter dashboard yang sama dengan kartu lain.
    const maxHari = s.jumlahHari || (STATE && STATE.dayCount) || 31;
    const r = getDashRange_();
    const a = r.dari, b = Math.min(r.sampai || maxHari, maxHari);

    const k = hitungKartuReliever_(s.data, a, b);
    document.getElementById('relieverRentangLabel').textContent =
      (s.periode ? s.periode.replace(/^periode\s*:?\s*/i, '') + ' | ' : '') + 'Tanggal ' + (a === b ? a : a + ' - ' + b);

    const cards = [
      { label: 'Jumlah Reliever', value: k.reliever, sub: 'unik pada rentang ini' },
      { label: 'Total Penggantian', value: k.penggantian, sub: 'reliever x hari' },
      { label: 'Karyawan Digantikan', value: k.digantikan, sub: 'unik' },
      { label: 'Di Luar Radius', value: k.luarRadius, color: k.luarRadius ? '#ef4444' : '' }
    ];
    document.getElementById('relieverCards').innerHTML = cards.map(c => `
      <div class="card">
        <div class="card-label">${c.label}</div>
        <div class="card-value"${c.color ? ` style="color:${c.color}"` : ''}>${c.value}</div>
        ${c.sub ? `<div class="card-sub">${escapeHtml(c.sub)}</div>` : ''}
      </div>`).join('');

    const t = s.terdaftar || {};
    document.getElementById('relieverHint').textContent =
      (k.belumPulang ? 'Belum absen pulang: ' + k.belumPulang + '. ' : '') +
      'Reliever terdaftar: ' + (t.aktif ?? 0) + ' aktif dari ' + (t.total ?? 0) + '. Rentang tanggal mengikuti filter di atas.';
  }

  /* ============ ARSIP PERIODE ============ */

  function loadArchivedPeriodsList() {
    if (!SESSION) return;
    google.script.run
      .withSuccessHandler(list => {
        const optionsHtml = '<option value="active">Periode Aktif</option>' +
          list.map(p => `<option value="${escapeHtml(p.key)}">📁 ${escapeHtml(p.period)}</option>`).join('');

        const sel = document.getElementById('periodSelector');
        const prevValue = sel.value;
        sel.innerHTML = optionsHtml;
        if (sel.querySelector(`option[value="${prevValue}"]`)) sel.value = prevValue;

        const logSel = document.getElementById('logPeriodSelect');
        if (logSel) {
          const prevLog = logSel.value;
          logSel.innerHTML = optionsHtml;
          logSel.value = selectHasOption_(logSel, prevLog) ? prevLog : 'active';
          onLogPeriodChange();
        }
      })
      .withFailureHandler(() => { /* diamkan kalau gagal, tidak kritikal */ })
      .getArchivedPeriods(SESSION.token);
  }
/** Dipakai SEMUA success handler mutasi (save cell, upload, tambah/hapus karyawan, dst)
 *  supaya filter Department yang sedang aktif tetap "nempel" setelah aksi apapun,
 *  bukannya balik ke "Semua Department" karena backend selalu balikin data unfiltered. */

  function filterTableByName_(wrapId, searchInputId) {
    const input = document.getElementById(searchInputId);
    if (!input) return;
    const query = input.value.trim().toLowerCase();

    const wrap = document.getElementById(wrapId);
    if (!wrap) return;
    const rows = wrap.querySelectorAll('tbody tr');
    let visibleCount = 0;

    rows.forEach(tr => {
      const name = tr.dataset.name || '';
      const match = !query || name.includes(query);
      tr.style.display = match ? '' : 'none';
      if (match) visibleCount++;
    });

    // Tampilkan pesan "tidak ditemukan" kalau hasil pencarian kosong
    let emptyRow = wrap.querySelector('.no-results-row');
    const tbody = wrap.querySelector('tbody');
    if (tbody) {
      if (query && visibleCount === 0) {
        if (!emptyRow) {
          const colCount = (wrap.querySelector('thead tr') || {}).children ? wrap.querySelector('thead tr').children.length : 5;
          emptyRow = document.createElement('tr');
          emptyRow.className = 'no-results-row';
          emptyRow.innerHTML = `<td colspan="${colCount}">Tidak ada karyawan dengan nama "${escapeHtml(input.value.trim())}"</td>`;
          tbody.appendChild(emptyRow);
        }
      } else if (emptyRow) {
        emptyRow.remove();
      }
    }
  }

  /** Indeks hari (0-based) yang ditampilkan grafik = rentang tanggal filter Dashboard (sama dengan kartu). */
  function getPeriodIndices(dayCount) {
    const r = getDashRange_();
    const dari = Math.max(r.dari, 1), sampai = Math.min(r.sampai || dayCount, dayCount);
    return Array.from({ length: Math.max(sampai - dari + 1, 0) }, (_, i) => dari - 1 + i);
  }

  /**
   * Cari card pembungkus canvas "Plan vs Actual" (referensi posisi yang sudah
   * ada di Index.html), lalu sisipkan card baru berisi canvas untuk grafik
   * Jam Kerja & Lembur tepat setelahnya. Dibuat sekali saja (idempotent) —
   * kalau elemennya sudah ada, langsung dipakai lagi tanpa dibuat ulang.
   * Ini membuat Index.html TIDAK PERLU diedit sama sekali.
   */
  let chartLembur = null; // tambahkan di deklarasi variabel chart yang sudah ada

function ensureJamKerjaChartCards_() {
    let jkCanvas = document.getElementById('chartJamKerja');
    let lemburCanvas = document.getElementById('chartLembur');
    if (jkCanvas && lemburCanvas) return { jamKerja: jkCanvas, lembur: lemburCanvas };

    const refCanvas = document.getElementById('chartPlanActual') || document.getElementById('chartTrenHarian');
    if (!refCanvas) return null;

    let refCard = refCanvas;
    for (let i = 0; i < 4; i++) {
      if (!refCard.parentElement) break;
      refCard = refCard.parentElement;
      if (refCard.classList && (refCard.classList.contains('card') || refCard.classList.contains('chart-card') || refCard.classList.contains('panel'))) break;
    }

    const newCard = document.createElement('div');
    newCard.className = refCard.className || 'card';
    newCard.id = 'jamKerjaChartCard';
    newCard.innerHTML = `
      <h3 style="margin:0 0 10px;font-size:14px;color:#1e293b;">⏱ Total Jam Kerja Harian</h3>
      <div style="position:relative;height:200px;">
        <canvas id="chartJamKerja"></canvas>
      </div>
      <h3 style="margin:16px 0 10px;font-size:14px;color:#1e293b;">👥 Jumlah Karyawan Lembur Harian</h3>
      <div style="position:relative;height:180px;">
        <canvas id="chartLembur"></canvas>
      </div>
    `;

    if (refCard.parentElement) {
      refCard.parentElement.insertBefore(newCard, refCard.nextSibling);
    } else {
      refCanvas.parentElement.appendChild(newCard);
    }

    return {
      jamKerja: document.getElementById('chartJamKerja'),

    const pickWithCutoff = arr => idx.map(i => (i < todayIdx ? arr[i] : null));

    // Jam Kerja & Lembur — dipisah jadi DUA chart terpisah (bukan dual-axis

  /* ============ TREN KEHADIRAN BULANAN (Dashboard) ============ */

  function loadTrenBulanan_() {
    if (!SESSION) return;

      .withSuccessHandler(data => renderTrenBulanan_(data))

      .getMonthlyTrendYear(tahun, SESSION.token);

  function renderTrenBulanan_(data) {
    if (!data || !data.labels || !data.persenHadir) return;

    const persen = data.persenHadir.filter(v => typeof v === 'number');
    const rata = persen.length ? (persen.reduce((s, v) => s + v, 0) / persen.length) : 0;
    const tertinggi = persen.length ? Math.max(...persen) : 0;
    const terendah = persen.length ? Math.min(...persen) : 0;

    const cardsEl = document.getElementById('trenBulananCards');
    if (cardsEl) {
      cardsEl.innerHTML = `

          <div class="card-label">Rata-rata % Hadir</div>

        </div>
        <div class="card">
          <div class="card-label">Tertinggi</div>
          <div class="card-value" style="color:#22c55e">${tertinggi.toFixed(1)}%</div>
        </div>
        <div class="card">
          <div class="card-label">Terendah</div>
          <div class="card-value" style="color:#ef4444">${terendah.toFixed(1)}%</div>
        </div>

    const canvas = document.getElementById('chartTrenBulanan');

        responsive: true,
        maintainAspectRatio: false,

    if (hint) hint.textContent = 'Menampilkan tren % kehadiran per bulan sepanjang tahun ' + new Date().getFullYear() + '.';
  }

/* ============ PERBANDINGAN PERIODE SEBELUMNYA (untuk indikator tren ↑↓) ============ */

let PREV_PERIOD_DASHBOARD_ = null;

// CATATAN ASUMSI: diasumsikan getArchivedPeriods() mengembalikan array terurut
// dari arsip TERLAMA ke TERBARU (seperti dipakai juga di loadArchivedPeriodsList()),
// jadi elemen TERAKHIR = arsip periode paling baru. Kalau ternyata urutannya
// terbalik di Kode.gs, tinggal ganti list[list.length-1] jadi list[0].
function loadPreviousPeriodComparison_() {
  if (!SESSION) return;
  google.script.run
    .withSuccessHandler(list => {
      if (!list || !list.length) { PREV_PERIOD_DASHBOARD_ = null; return; }
      const lastArchived = list[list.length - 1];
      google.script.run
        .withSuccessHandler(data => {
          PREV_PERIOD_DASHBOARD_ = data;
          if (STATE) renderCards();
        })
        .withFailureHandler(() => { PREV_PERIOD_DASHBOARD_ = null; })
        .getArchivedData(lastArchived.key, SESSION.token);
    })
    .withFailureHandler(() => { PREV_PERIOD_DASHBOARD_ = null; })
    .getArchivedPeriods(SESSION.token);
}

function computeComparableMetrics_(data) {
  if (!data) return null;
  const rekap = (data.rekap || []).filter(r => r.nama && String(r.nama).trim() !== '');
  const totalHadir = rekap.reduce((s, r) => s + (Number(r.hadir) || 0), 0);
  const jk = data.jamKerjaRingkasan || {};
  return {
    totalHadir: totalHadir,
    totalJamKerja: typeof jk.totalJamKerja === 'number' ? jk.totalJamKerja : null,
    totalKekuranganJam: typeof jk.totalKekuranganJam === 'number' ? jk.totalKekuranganJam : null
  };
}

function renderTrendBadge_(currentVal, prevVal, higherIsBetter) {
  if (typeof currentVal !== 'number' || typeof prevVal !== 'number' || !prevVal) return '';
  const diff = currentVal - prevVal;
  if (Math.abs(diff) < 0.005) return '<span class="trend-badge trend-flat" style="font-size:12px;margin-left:6px;color:#64748b;">→ 0%</span>';
  const pct = (diff / Math.abs(prevVal)) * 100;
  const isUp = diff > 0;
  const isGood = higherIsBetter ? isUp : !isUp;
  const color = isGood ? '#22c55e' : '#ef4444';
  const arrow = isUp ? '▲' : '▼';
  return `<span class="trend-badge" style="color:${color};font-size:12px;margin-left:6px;font-weight:600;">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
}

function renderAvgJamKerjaSparkline_() {
  if (typeof Chart === 'undefined') return;
  const canvas = document.getElementById('avgJamKerjaSparkline');
  if (!canvas || !STATE.trenHarian || !STATE.trenHarian.totalJamKerjaPerHari) return;
  if (chartAvgJamKerjaSparkline) chartAvgJamKerjaSparkline.destroy();
  const range = getDashRange_();
  const data = STATE.trenHarian.totalJamKerjaPerHari;
  const todayIdx = (typeof STATE.trenHarian.todayDayIndex === 'number') ? STATE.trenHarian.todayDayIndex : data.length;
  const values = data.map((v, i) => (i < todayIdx ? v : null)).slice(range.dari - 1, range.sampai);
  chartAvgJamKerjaSparkline = new Chart(canvas, {
    type: 'line',
    data: {
      labels: values.map((_, i) => i + 1),
      datasets: [{ data: values, borderColor: '#0ea5e9', backgroundColor: 'rgba(14,165,233,0.15)', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: true, spanGaps: false }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { x: { display: false }, y: { display: false } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });
}

  /* ============ TOP 5 TERENDAH / TERBAIK ============ */

  function renderRankLists() {
    const rekap = (STATE.rekap || []).filter(r =>
      r.nama && String(r.nama).trim() !== '' && typeof r.persenKehadiran === 'number'
    );
    if (!rekap.length) return;

    const sorted = [...rekap].sort((a, b) => b.persenKehadiran - a.persenKehadiran);

    const best = sorted.slice(0, 5);
    const worst = [...sorted].reverse().slice(0, 5);

    renderRankBlock('rankBest', best, 'best');
    renderRankBlock('rankWorst', worst, 'worst');
  }

  function renderRankBlock(wrapId, rows, kind) {
    const el = document.getElementById(wrapId);
    el.innerHTML = rows.map((r, i) => {
      const pctNum = r.persenKehadiran * 100;
      const pct = pctNum.toFixed(1) + '%';
      // Warna merah hanya kalau memang di bawah ambang batas perhatian (mis. 80%),
      // bukan otomatis merah karena masuk daftar "5 terendah".
      const pctColor = pctNum < 80 ? '#ef4444' : '#1e293b';
      return `
        <div class="rank-row rank-${kind}">
          <div class="rank-badge">${i + 1}</div>
          <div class="rank-info">
            <div class="rank-name">${escapeHtml(r.nama)}</div>
            <div class="rank-sub">${escapeHtml(r.jabatan)} · Alfa: ${r.alfa} · Izin: ${r.izin} · Sakit: ${r.sakit}</div>
          </div>
          <div class="rank-pct" style="color:${pctColor}">${pct}</div>
        </div>`;
    }).join('') || '<p class="muted">Belum ada data.</p>';
  }

  /* ============ CARDS DASHBOARD (ringkasan + rincian absen + rata-rata jam kerja) ============ */
  function renderAlignmentWarnings_() {
    const el = document.getElementById('alignmentWarningBanner');
    if (!el) return;
    const warnings = STATE.alignmentWarnings || [];
    if (!warnings.length) {
      el.classList.add('hidden');
      el.innerHTML = '';
      return;
    }
    el.innerHTML =
      '⚠️ <strong>Peringatan: Baris Jadwal &amp; Realisasi Tidak Sejajar</strong>' +
      '<ul style="margin:6px 0 0 20px;padding:0;">' +
      warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('') +
      '</ul>';
    el.classList.remove('hidden');
  }
  /* ============ FILTER TANGGAL DASHBOARD (berlaku untuk semua kartu + Rincian Absen + Reliever) ============ */

  let dashRange_ = null; // { dari, sampai }; null = seluruh periode

  function getDashRange_() {
    const n = (STATE && STATE.dayCount) || 0;
    if (!n || !dashRange_) return { dari: 1, sampai: n, penuh: true };
    const dari = Math.min(Math.max(parseInt(dashRange_.dari, 10) || 1, 1), n);
    const sampai = Math.min(Math.max(parseInt(dashRange_.sampai, 10) || n, dari), n);
    return { dari: dari, sampai: sampai, penuh: dari === 1 && sampai === n };
  }

  function sumRange_(arr, dari, sampai) {
    let s = 0;
    if (!Array.isArray(arr)) return s;
    for (let i = dari - 1; i < sampai && i < arr.length; i++) s += Number(arr[i]) || 0;
    return s;
  }

  function round2Front_(n) { return Math.round(n * 100) / 100; }

  /** Angka kartu untuk rentang tanggal terpilih, dari deret harian (trenHarian). Null bila data harian tidak tersedia. */
  function computeRangeFigures_(range) {
    const th = STATE && STATE.trenHarian;
    if (!th || !Array.isArray(th.planCount) || !Array.isArray(th.hadir)) return null;
    const S = a => sumRange_(a, range.dari, range.sampai);
    const jadwal = S(th.planCount), hadir = S(th.hadir);
    const jam = Array.isArray(th.totalJamKerjaPerHari) ? round2Front_(S(th.totalJamKerjaPerHari)) : 0;
    const target = Array.isArray(th.targetJamPerHari) ? round2Front_(S(th.targetJamPerHari)) : null;
    return {
      jadwal: jadwal, hadir: hadir,
      alfa: S(th.alfa), izin: S(th.izin), sakit: S(th.sakit), cuti: S(th.cuti), off: S(th.off),
      persen: jadwal > 0 ? Math.round((hadir / jadwal) * 100) + '%' : '0%',
      jam: jam, target: target,
      hariJam: Array.isArray(th.jumlahEntriJamPerHari) ? S(th.jumlahEntriJamPerHari) : null
    };
  }

  function ensureDashRangeOptions_() {
    const n = (STATE && STATE.dayCount) || 0;
    const dari = document.getElementById('dashDari');
    const sampai = document.getElementById('dashSampai');
    if (!dari || !sampai || !n) return;
    if (dari.options.length !== n) {
      const opts = Array.from({ length: n }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
      dari.innerHTML = opts; sampai.innerHTML = opts;
    }
    const r = getDashRange_();
    dari.value = String(r.dari);
    sampai.value = String(r.sampai);
    const note = document.getElementById('dashRangeNote');
    if (note) {
      const bisa = !!computeRangeFigures_({ dari: 1, sampai: n });
      note.textContent = r.penuh ? 'Menampilkan seluruh periode.' :
        (bisa ? 'Kartu dan Rincian Absen dihitung untuk tanggal ' + (r.dari === r.sampai ? r.dari : r.dari + ' - ' + r.sampai) + '.' :
          'Data harian belum tersedia, menampilkan seluruh periode.');
    }
  }

  function onDashRangeChange(sel) {
    const dari = document.getElementById('dashDari');
    const sampai = document.getElementById('dashSampai');
    let a = parseInt(dari.value, 10), b = parseInt(sampai.value, 10);
    if (a > b) { if (sel === dari) b = a; else a = b; } // rentang terbalik dirapikan
    dashRange_ = { dari: a, sampai: b };
    applyDashRange_();
  }

  function setDashRangeHariIni() {
    const th = STATE && STATE.trenHarian;
    const idx = th && typeof th.todayDayIndex === 'number' ? th.todayDayIndex : null; // jumlah hari yang sudah lewat
    const n = (STATE && STATE.dayCount) || 1;
    const h = idx !== null ? Math.min(Math.max(idx, 1), n) : Math.min(new Date().getDate(), n);
    dashRange_ = { dari: h, sampai: h };
    applyDashRange_();
  }

  function setDashRangePenuh() {
    dashRange_ = null;
    applyDashRange_();
  }

  function applyDashRange_() {
    if (!STATE) return;
    renderCards();
    renderCharts();
    if (typeof renderRelieverPanel_ === 'function') renderRelieverPanel_();
  }

  function renderCards() {
    const d = STATE.dashboard;

    const rekapForTotals_ = (STATE.rekap || []).filter(r => r.nama && String(r.nama).trim() !== '');
    const range = getDashRange_();
    const rf = range.penuh ? null : computeRangeFigures_(range); // null = pakai angka seluruh periode
    ensureDashRangeOptions_();

    const totalAlfa = rf ? rf.alfa : rekapForTotals_.reduce((s, r) => s + (Number(r.alfa) || 0), 0);
    const totalIzin = rf ? rf.izin : rekapForTotals_.reduce((s, r) => s + (Number(r.izin) || 0), 0);
    const totalSakit = rf ? rf.sakit : rekapForTotals_.reduce((s, r) => s + (Number(r.sakit) || 0), 0);
    const totalTidakHadir = totalAlfa + totalIzin + totalSakit;
    const totalHadirNum = rf ? rf.hadir : rekapForTotals_.reduce((s, r) => s + (Number(r.hadir) || 0), 0);

    // Perbandingan dengan periode sebelumnya hanya masuk akal untuk seluruh periode.
    const prevMetrics = rf ? null : computeComparableMetrics_(PREV_PERIOD_DASHBOARD_);
    const trendTotalHadir = prevMetrics ? renderTrendBadge_(totalHadirNum, prevMetrics.totalHadir, true) : '';

    const cardsData = [
      { label: 'Total Karyawan', value: d['TOTAL KARYAWAN'] },
      { label: 'Total Hari Kerja Terjadwal', value: rf ? rf.jadwal : d['TOTAL HARI KERJA TERJADWAL'] },
      { label: 'Total Hadir Aktual', value: rf ? rf.hadir : d['TOTAL HADIR AKTUAL'], color: '#22c55e', trend: trendTotalHadir },
      { label: 'Rata-rata Kehadiran', value: rf ? rf.persen : d['RATA-RATA KEHADIRAN'] },
      { label: 'Total Tidak Hadir (Alfa/Izin/Sakit)', value: totalTidakHadir, color: '#ef4444' },
      { label: 'Total OFF (Libur)', value: rf ? rf.off : d['TOTAL OFF (LIBUR)'] }
    ];

    let html = cardsData.map(c => `
      <div class="card">
        <div class="card-label">${c.label}</div>
        <div class="card-value" style="color:${c.color || '#1e293b'}">${c.value ?? '-'}${c.trend || ''}</div>
      </div>
    `).join('');

    let jk = STATE.jamKerjaRingkasan;
    if (jk && rf) {
      jk = {
        totalJamKerja: rf.jam,
        totalTargetJam: rf.target === null ? '-' : rf.target,
        totalKekuranganJam: rf.target === null ? 0 : round2Front_(rf.target - rf.jam)
      };
    }
    if (jk) {
      const kurang = jk.totalKekuranganJam;
      const kurangColor = kurang > 0 ? '#ef4444' : '#22c55e';
      const trendJamKerja = prevMetrics ? renderTrendBadge_(jk.totalJamKerja, prevMetrics.totalJamKerja, true) : '';
      const trendKurang = prevMetrics ? renderTrendBadge_(kurang, prevMetrics.totalKekuranganJam, false) : '';
      html += `
        <div class="card">
          <div class="card-label">Total Jam Kerja</div>
          <div class="card-value" style="color:#0ea5e9">${jk.totalJamKerja} jam${trendJamKerja}</div>
        </div>
        <div class="card">
          <div class="card-label">Target Jam Kerja</div>
          <div class="card-value" style="color:#64748b">${jk.totalTargetJam} jam</div>
        </div>
        <div class="card">
          <div class="card-label">Kekurangan Jam</div>
          <div class="card-value" style="color:${kurangColor}">${jk.totalTargetJam === '-' ? '-' : (kurang > 0 ? kurang : 0)} jam${trendKurang}</div>
        </div>
        <div class="card">
          <div class="card-label-row">
            <span class="card-label">Rata-rata Jam Kerja / Orang</span>
            <select id="avgJamKerjaFilter" onchange="onAvgJamKerjaFilterChange()">
              <option value="hari" ${avgJamKerjaMode === 'hari' ? 'selected' : ''}>Per Hari</option>
              <option value="minggu" ${avgJamKerjaMode === 'minggu' ? 'selected' : ''}>Per Minggu</option>
              <option value="bulan" ${avgJamKerjaMode === 'bulan' ? 'selected' : ''}>${rf ? 'Per Rentang' : 'Per Bulan'}</option>
            </select>
          </div>
          <div class="card-value" style="color:#0ea5e9" id="avgJamKerjaValue">-</div>
          <div style="height:36px;margin-top:8px;"><canvas id="avgJamKerjaSparkline"></canvas></div>
        </div>
      `;
    }

    document.getElementById('cards').innerHTML = html;
    if (jk) computeAndShowAvgJamKerja_();
    renderAvgJamKerjaSparkline_();
    renderAbsenPieChart_(totalAlfa, totalIzin, totalSakit);
  }

    function renderAbsenPieChart_(totalAlfa, totalIzin, totalSakit) {
    if (typeof Chart === 'undefined') return;
    const canvas = document.getElementById('chartAbsenPie');
    if (!canvas) return;

    if (chartAbsenPie) chartAbsenPie.destroy();

    const total = totalAlfa + totalIzin + totalSakit;
    renderAbsenPieStats_(totalAlfa, totalIzin, totalSakit, total);

    if (total === 0) {
      chartAbsenPie = new Chart(canvas, {
        type: 'pie',
        data: { labels: ['Belum ada data'], datasets: [{ data: [1], backgroundColor: ['#e2e8f0'] }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, tooltip: { enabled: false } }
        }
      });
      return;
    }

    chartAbsenPie = new Chart(canvas, {
      type: 'pie',
      data: {
        labels: ['Alfa', 'Izin', 'Sakit'],
        datasets: [{
          data: [totalAlfa, totalIzin, totalSakit],
          backgroundColor: ['#ef4444', '#3b82f6', '#f59e0b']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } },
          tooltip: {
            callbacks: {
              label: ctx => {
                const val = ctx.raw;
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                return `${ctx.label}: ${val} (${pct}%)`;
              }
            }
          }
        }
      }
    });
  }

  function renderAbsenPieStats_(totalAlfa, totalIzin, totalSakit, total) {
    const el = document.getElementById('absenPieStats');
    if (!el) return;
    const rows = [
      { label: 'Alfa', value: totalAlfa, color: '#ef4444' },
      { label: 'Izin', value: totalIzin, color: '#3b82f6' },
      { label: 'Sakit', value: totalSakit, color: '#f59e0b' }
    ];
    el.innerHTML = rows.map(r => {
      const pct = total > 0 ? ((r.value / total) * 100).toFixed(1) : '0.0';
      return `
        <div class="absen-stat-row">
          <span class="absen-stat-label">
            <span class="absen-stat-dot" style="background:${r.color}"></span>
            ${r.label}
          </span>
          <span>
            <span class="absen-stat-value" style="color:${r.color}">${r.value}</span>
            <span class="absen-stat-pct">(${pct}%)</span>
          </span>
        </div>`;
    }).join('') + `
      <div class="absen-stat-row" style="background:#eef2ff;border-color:#c7d2fe;">

  function onAvgJamKerjaFilterChange() {
    avgJamKerjaMode = document.getElementById('avgJamKerjaFilter').value;
    computeAndShowAvgJamKerja_();
  }

  function computeAndShowAvgJamKerja_() {
    const el = document.getElementById('avgJamKerjaValue');
    if (!el) return;

    const rekap = (STATE.rekap || []).filter(r => r.nama && String(r.nama).trim() !== '');
    let totalJamKerja = rekap.reduce((s, r) => s + (Number(r.totalJamKerja) || 0), 0);
    let totalHariKerja = rekap.reduce((s, r) => s + (Number(r.totalHariKerja) || 0), 0);
    const jumlahKaryawan = rekap.length;

    const range = getDashRange_();
    if (!range.penuh) {
      const rf = computeRangeFigures_(range);
      if (rf && rf.hariJam !== null) { totalJamKerja = rf.jam; totalHariKerja = rf.hariJam; }
    }

    const avgPerHari = totalHariKerja > 0 ? (totalJamKerja / totalHariKerja) : 0;

    let displayValue = 0;
    let unitLabel = '';

    if (avgJamKerjaMode === 'hari') {
      displayValue = avgPerHari;
      unitLabel = 'jam / hari / orang';
    } else if (avgJamKerjaMode === 'minggu') {
      displayValue = avgPerHari * 7;
      unitLabel = 'jam / minggu / orang';
    } else {
      displayValue = jumlahKaryawan > 0 ? (totalJamKerja / jumlahKaryawan) : 0;
      unitLabel = 'jam / bulan / orang';
    }

    el.innerHTML = displayValue.toFixed(2) + ' <span class="card-unit">' + unitLabel + '</span>';
  }

  function renderLegend(elId, codes) {
    const el = document.getElementById(elId);
    const seenLabels = new Set();
    el.innerHTML = Object.entries(codes)
      .filter(([code, info]) => {
        if (code === '') return false;
        if (seenLabels.has(info.label)) return false;
        seenLabels.add(info.label);
        return true;
      })
      .map(([code, info]) => `
        <span class="legend-item">
          <span class="legend-dot" style="background:${info.color}"></span>
          ${code} = ${info.label}
        </span>`).join('');
  }

  function renderGrid(wrapId, employees, dayCount, dayNames, codeMap, editable, cellType) {
    let html = '<table><thead><tr><th class="name-col">Nama Karyawan</th><th>Jabatan</th>';
    for (let i = 0; i < dayCount; i++) {
      html += `<th>${i + 1}<br><span class="muted">${dayNames[i] || ''}</span></th>`;
    }
    html += '</tr></thead><tbody>';

    employees.forEach(emp => {
      html += `<tr data-name="${escapeHtml((emp.nama || '').toLowerCase())}"><td class="name-col">${escapeHtml(emp.nama)}</td><td>${escapeHtml(emp.jabatan)}</td>`;
      emp.days.forEach((val, dayIndex) => {
        const code = normalizeCode(val);
        const info = codeMap[code] || codeMap[''] || { color: '#94a3b8' };
        const bg = code ? hexToRgba(info.color, 0.18) : 'transparent';
        const fg = code ? info.color : '#cbd5e1';
        const label = code || '·';
        const cellAttrs = editable
          ? `data-type="${cellType}" data-row="${emp.rowIndex}" data-day="${dayIndex}" data-name="${escapeHtml(emp.nama)}" data-daynum="${dayIndex + 1}" onclick="toggleGridCell(this, event, '${cellType}')"`
          : '';
        html += `<td class="day-cell" style="background:${bg};color:${fg}" ${cellAttrs}>${label}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById(wrapId).innerHTML = html;
  }

  function normalizeCode(v) {
    if (v === null || v === undefined) return '';
    v = String(v).trim().toUpperCase();
    if (v === '1' || v === '1.0') return '1';
    return v;
  }

  function renderRekapTable(wrapId, rows, full) {
    const cols = ['No', 'Nama', 'NIK', 'Jabatan', 'Jadwal', 'Hadir', 'Alfa', 'Izin', 'Sakit', 'Cuti', 'OFF', '% Hadir', 'Rank', 'Jam Kerja', 'Target Jam', 'Kekurangan Jam'];
    let html = '<table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';

  /* ============ INPUT REALISASI & JADWAL (pilih sel, pilih kode, Simpan Batch; butuh login) ============ */

  /* Input Realisasi dan Jadwal Kerja memakai alur yang sama: klik sel (boleh banyak) -> pilih kode ->
     perubahan DITAHAN dulu -> "Simpan Batch" mengirim semuanya sekaligus. */

  const BATCH_GRIDS_ = {
    realisasi: {
      label: 'Realisasi', prefix: 'input', wrapId: 'realisasiWrap',
      dataKey: 'realisasi', codesKey: 'statusCodes', saveFn: 'saveRealisasiBatch',
      pickTitle: 'Pilih kode untuk sel terpilih',
      denyMsg: 'Role Anda tidak punya izin mengubah Realisasi',
      canEdit: () => !!SESSION && currentViewPeriodKey === 'active' &&
        !!MY_PERMISSIONS_.edit && MY_PERMISSIONS_.edit.indexOf('input') !== -1
    },
    jadwal: {
      label: 'Jadwal', prefix: 'jadwal', wrapId: 'jadwalWrap',
      dataKey: 'jadwal', codesKey: 'shiftCodes', saveFn: 'saveJadwalBatch',
      pickTitle: 'Pilih shift untuk sel terpilih',
      denyMsg: 'Hanya admin yang boleh mengubah Jadwal',
      canEdit: () => canManageEmployee_() && currentViewPeriodKey === 'active'
    }
  };
  const BATCH_STATE_ = {};
  Object.keys(BATCH_GRIDS_).forEach(k => {
    // pending: "baris:hari" -> { rowIndex, dayIndex, kode, nama }; selected: sel yang sedang dipilih
    BATCH_STATE_[k] = { pending: new Map(), selected: new Set(), last: null, saving: false, period: null };
  });

  function batchEl_(kind, suffix) { return document.getElementById(BATCH_GRIDS_[kind].prefix + suffix); }
  function batchKey_(row, day) { return row + ':' + day; }

  function batchFindRow_(kind, rowIndex) {
    const list = (STATE && STATE[BATCH_GRIDS_[kind].dataKey]) || [];
    return list.find(e => Number(e.rowIndex) === rowIndex) || null;
  }

  function batchCurrentCode_(kind, rowIndex, dayIndex) {
    const emp = batchFindRow_(kind, rowIndex);
    return emp ? normalizeCode(emp.days[dayIndex]) : '';
  }

  /** Kode untuk tombol: semua kode dari backend + "Kosongkan" (selalu paling kanan). */
  function batchButtonCodes_(kind) {
    const map = (STATE && STATE[BATCH_GRIDS_[kind].codesKey]) || {};
    const entries = Object.entries(map).filter(e => e[0] !== '');
    const blank = map[''] || { label: 'Belum diisi', color: '#e5e7eb' };
    entries.push(['', blank]);
    return entries;
  }

  function toggleGridCell(cell, ev, kind) {
    const cfg = BATCH_GRIDS_[kind], st = BATCH_STATE_[kind];
    if (currentViewPeriodKey !== 'active') {
      toast('Data arsip bersifat read-only, tidak bisa diubah', true);
      return;
    }
    if (!SESSION) {
      toast('Silakan login dulu untuk mengubah data', true);
      showLoginGate();
      return;
    }
    if (!cfg.canEdit()) {
      toast(cfg.denyMsg, true);
      return;
    }
    if (st.saving) return;

    const row = parseInt(cell.dataset.row, 10);
    const day = parseInt(cell.dataset.day, 10);
    if (ev && ev.shiftKey && st.last && st.last.row === row) {
      const from = Math.min(st.last.day, day);
      const to = Math.max(st.last.day, day);
      for (let d = from; d <= to; d++) st.selected.add(batchKey_(row, d));
    } else {
      const key = batchKey_(row, day);
      if (st.selected.has(key)) st.selected.delete(key); else st.selected.add(key);
    }
    st.last = { row: row, day: day };
    paintBatchCells_(kind);
    refreshBatchDock_(kind);
  }

  /** Gambar ulang tampilan semua sel dari data + perubahan tertunda + pilihan. */
  function paintBatchCells_(kind) {
    const cfg = BATCH_GRIDS_[kind], st = BATCH_STATE_[kind];
    const codes = (STATE && STATE[cfg.codesKey]) || {};
    document.querySelectorAll('#' + cfg.wrapId + ' td.day-cell[data-row]').forEach(cell => {
      const row = parseInt(cell.dataset.row, 10);
      const day = parseInt(cell.dataset.day, 10);
      const key = batchKey_(row, day);
      const pending = st.pending.get(key);
      const code = pending ? pending.kode : batchCurrentCode_(kind, row, day);
      const info = codes[code] || codes[''] || { color: '#94a3b8' };
      cell.textContent = code || '·';
      cell.style.background = code ? hexToRgba(info.color, 0.18) : 'transparent';
      cell.style.color = code ? info.color : '#cbd5e1';
      cell.classList.toggle('pending', !!pending);
      cell.classList.toggle('selected', st.selected.has(key));
    });
  }

  function refreshBatchDock_(kind) {
    const cfg = BATCH_GRIDS_[kind], st = BATCH_STATE_[kind];
    const box = batchEl_(kind, 'CodeButtons');
    if (!box) return;
    const selCount = st.selected.size;
    const pendCount = st.pending.size;

    batchEl_(kind, 'CodesTitle').textContent = cfg.pickTitle + (selCount ? ' (' + selCount + ' sel)' : '');

    const codes = batchButtonCodes_(kind);
    const signature = codes.map(e => e[0]).join('|');
    if (box.dataset.signature !== signature) {
      box.innerHTML = '';
      codes.forEach(([code, info]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-btn';
        btn.title = code ? info.label : 'Kosongkan (Belum diisi)';
        btn.textContent = code || '✕';
        btn.style.borderColor = info.color;
        btn.onclick = () => applyBatchCode_(kind, code);
        box.appendChild(btn);
      });
      box.dataset.signature = signature;
    }
    box.querySelectorAll('button').forEach(b => { b.disabled = selCount === 0 || st.saving; });

    batchEl_(kind, 'ClearSelBtn').disabled = selCount === 0 || st.saving;
    batchEl_(kind, 'PendingInfo').textContent = pendCount + ' perubahan belum disimpan';
    batchEl_(kind, 'SaveBar').classList.toggle('has-pending', pendCount > 0);
    batchEl_(kind, 'SaveBatchBtn').disabled = pendCount === 0 || st.saving;
    batchEl_(kind, 'DiscardBtn').disabled = pendCount === 0 || st.saving;
  }

  function applyBatchCode_(kind, code) {
    const cfg = BATCH_GRIDS_[kind], st = BATCH_STATE_[kind];
    if (!cfg.canEdit() || !st.selected.size || st.saving) return;
    if (!st.pending.size) st.period = STATE.period;

    st.selected.forEach(key => {
      const parts = key.split(':');
      const row = Number(parts[0]);
      const day = Number(parts[1]);
      const emp = batchFindRow_(kind, row);
      if (!emp) return;
      if (code === batchCurrentCode_(kind, row, day)) {
        st.pending.delete(key);           // sama dengan isi sheet -> bukan perubahan
      } else {
        st.pending.set(key, { rowIndex: row, dayIndex: day, kode: code, nama: emp.nama });
      }
    });
    st.selected.clear();
    st.last = null;
    if (!st.pending.size) st.period = null;
    paintBatchCells_(kind);
    refreshBatchDock_(kind);
  }

  function clearBatchSelection_(kind) {
    const st = BATCH_STATE_[kind];
    st.selected.clear();
    st.last = null;
    paintBatchCells_(kind);
    refreshBatchDock_(kind);
  }

  function discardBatchPending_(kind) {
    const st = BATCH_STATE_[kind];
    if (!st.pending.size || st.saving) return;
    if (!confirm('Batalkan ' + st.pending.size + ' perubahan yang belum disimpan?')) return;
    clearBatchPending_(kind);
    toast('Perubahan dibatalkan');
  }

  /** Buang semua perubahan tertunda + pilihan (logout, ganti periode, dll.). */
  function clearBatchPending_(kind) {
    const st = BATCH_STATE_[kind];
    st.pending.clear();
    st.selected.clear();
    st.last = null;
    st.period = null;
    paintBatchCells_(kind);
    refreshBatchDock_(kind);
  }

  function clearAllBatchPending_() {
    Object.keys(BATCH_GRIDS_).forEach(clearBatchPending_);
  }

  /** Dipanggil setiap grid digambar ulang (polling, simpan, ganti periode). */
  function syncBatchPending_(kind) {
    const cfg = BATCH_GRIDS_[kind], st = BATCH_STATE_[kind];
    if (!cfg.canEdit()) {
      if (st.pending.size) toast('Perubahan ' + cfg.label + ' yang belum disimpan dibuang', true);
      clearBatchPending_(kind);
      return;
    }
    if (st.pending.size && st.period && STATE.period !== st.period) {
      toast('Periode berubah, perubahan ' + cfg.label + ' yang belum disimpan dibuang', true);
      clearBatchPending_(kind);
      return;
    }
    // Data bisa bergeser (karyawan ditambah/dihapus): buang perubahan yang barisnya bukan lagi karyawan yang sama.
    let dropped = 0;
    Array.from(st.pending.keys()).forEach(key => {
      const p = st.pending.get(key);
      const emp = batchFindRow_(kind, p.rowIndex);
      if (!emp || emp.nama !== p.nama) { st.pending.delete(key); dropped++; }
    });
    Array.from(st.selected).forEach(key => {
      if (!batchFindRow_(kind, Number(key.split(':')[0]))) st.selected.delete(key);
    });
    if (dropped) toast(dropped + ' perubahan dibuang karena data karyawan di sheet berubah', true);
    if (!st.pending.size) st.period = null;
    paintBatchCells_(kind);
    refreshBatchDock_(kind);
  }

  function saveBatchPending_(kind) {
    const cfg = BATCH_GRIDS_[kind], st = BATCH_STATE_[kind];
    if (!st.pending.size || st.saving) return;
    if (!SESSION) { toast('Silakan login dulu untuk mengubah data', true); showLoginGate(); return; }

    const updates = Array.from(st.pending.values())
      .map(p => ({ rowIndex: p.rowIndex, dayIndex: p.dayIndex, kode: p.kode }));
    const saveBtn = batchEl_(kind, 'SaveBatchBtn');
    st.saving = true;
    refreshBatchDock_(kind);
    saveBtn.textContent = '⏳ Menyimpan...';

    google.script.run
      .withSuccessHandler(data => {
        st.saving = false;
        saveBtn.textContent = 'Simpan Batch';
        st.pending.clear();
        st.selected.clear();
        st.period = null;
        applyStateAndRerender_(data);
        toast(updates.length + ' sel ' + cfg.label.toLowerCase() + ' tersimpan');
      })
      .withFailureHandler(err => {
        st.saving = false;
        saveBtn.textContent = 'Simpan Batch';
        refreshBatchDock_(kind);
        toast('Gagal menyimpan (tidak ada sel yang tersimpan): ' + err.message, true);
        if (isAuthError_(err.message)) doLogout();
      })[cfg.saveFn](updates, SESSION.token);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    Object.keys(BATCH_GRIDS_).forEach(kind => {
      const st = BATCH_STATE_[kind];
      if (st.selected.size && !st.saving) clearBatchSelection_(kind);
    });
  });
  window.addEventListener('beforeunload', function (e) {
    if (Object.keys(BATCH_STATE_).some(k => BATCH_STATE_[k].pending.size)) { e.preventDefault(); e.returnValue = ''; }
  });

    if (!canManageEmployee_()) {
      toast('Hanya admin yang boleh menambah karyawan', true);
      return;
    }
    document.getElementById('newEmployeeNama').value = '';
    document.getElementById('newEmployeeNik').value = '';
    document.getElementById('newEmployeeEmail').value = '';
    document.getElementById('newEmployeeNoHp').value = '';
    document.getElementById('newEmployeeDept').value = '';
document.getElementById('newEmployeeDeptSearch').value = '';
document.getElementById('newEmployeeDeptOptions').classList.add('hidden');
if (!DAFTAR_KARYAWAN_DATA.length) loadDaftarKaryawan();

  let deptSelectionInProgress_ = false;

  function getUniqueDepartmentsList_() {
    return Array.from(new Set(
      (DAFTAR_KARYAWAN_DATA || []).map(k => (k.department || '').trim()).filter(Boolean)
    )).sort();

  function renderDeptSearchOptions_(query) {
  const box = document.getElementById('newEmployeeDeptOptions');
  const all = getUniqueDepartmentsList_();
  const q = (query || '').trim();
  const qLower = q.toLowerCase();
  const filtered = qLower ? all.filter(d => d.toLowerCase().includes(qLower)) : all;

  const exactMatch = q && all.some(d => d.toLowerCase() === qLower);
  const canAddNew = q.length > 0 && !exactMatch;

  let html = '';
  if (!filtered.length && !canAddNew) {
    html = '<div class="dept-search-empty">Department tidak ditemukan.</div>';
  } else {
    html = filtered.slice(0, 10).map(d =>
      `<div class="dept-search-option" data-dept="${escapeHtml(d)}">${escapeHtml(d)}</div>`
    ).join('');
  }

  if (canAddNew) {
    html += `<div class="dept-search-option dept-search-add-new" data-dept="${escapeHtml(q)}" style="color:#2563eb;font-weight:600;border-top:1px solid #e2e8f0;">➕ Tambah "${escapeHtml(q)}" sebagai department baru</div>`;
  }

  box.innerHTML = html;
  box.classList.remove('hidden');
  ensureDeptOptionsListener_();
}

let deptOptionsListenerAttached_ = false;
function ensureDeptOptionsListener_() {
  if (deptOptionsListenerAttached_) return;
  const box = document.getElementById('newEmployeeDeptOptions');
  box.addEventListener('mousedown', e => {
    const opt = e.target.closest('.dept-search-option[data-dept]');
    if (!opt) return;
    selectDeptOption_(opt.dataset.dept);

  deptOptionsListenerAttached_ = true;
}

    document.getElementById('newEmployeeDept').value = '';

      if (deptSelectionInProgress_) { deptSelectionInProgress_ = false; return; }

  const department = document.getElementById('newEmployeeDept').value.trim();
  const jabatan = document.getElementById('newEmployeeJabatan').value.trim();
  const email = document.getElementById('newEmployeeEmail').value.trim();
  const noHp = document.getElementById('newEmployeeNoHp').value.trim();

    document.getElementById('addEmployeeError').textContent = 'Nama karyawan wajib diisi.';

    return;
  }
  if (!department) {
    document.getElementById('addEmployeeError').textContent = 'Pilih Department dari daftar yang tersedia (tidak bisa ketik bebas).';
    return;
  }
    const btn = document.getElementById('addEmployeeSubmit');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(data => {
        btn.disabled = false;
        closeAddEmployeePicker();
        applyStateAndRerender_(data);
        loadArchivedPeriodsList();
        loadDaftarKaryawan();
        loadUnassignedEmployees_();
        toast('Karyawan "' + nama + '" berhasil ditambahkan. Karyawan baru masuk sebagai "Belum Terjadwal" — assign lewat menu Setting > Assign Karyawan ke Jadwal.');
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        document.getElementById('addEmployeeError').textContent = err.message;
      })
      .addEmployee(nama, jabatan, nik, department, email, noHp, SESSION ? SESSION.token : null);
  }

  function triggerBase64Download(base64, filename, mimeType) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  }
